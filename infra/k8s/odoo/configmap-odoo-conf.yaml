apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-conf
  namespace: ic-demo
data:
  # Shared base — the three deployments (web, bus, cron) overlay only the
  # knobs they need via env vars read by a small entrypoint wrapper, or via
  # their own ConfigMap keys. We ship the full base here so the image stays
  # unaware of the deployment shape.
  odoo.conf: |
    [options]
    addons_path = /opt/odoo/enterprise,/opt/odoo/odoo/addons,/opt/odoo/ic_demo,/opt/odoo/ic_demo/addons/oca,/opt/odoo/ic_demo/addons/custom
    data_dir    = /var/lib/odoo
    proxy_mode  = True
    dbfilter    = ^ic_demo$
    list_db     = False

    db_host         = pgbouncer.ic-demo.svc.cluster.local
    db_port         = 6432
    db_user         = ic_demo
    db_replica_host = pgbouncer.ic-demo.svc.cluster.local
    db_replica_port = 6432
    db_maxconn      = 20
    db_sslmode      = prefer

    xmlrpc_port          = 8069
    gevent_port          = 8072
    longpolling_port     = 8072
    limit_request        = 8192
    limit_memory_soft    = 2147483648
    limit_memory_hard    = 2684354560
    limit_time_cpu       = 60
    limit_time_real      = 120
    limit_time_real_cron = 1800

    log_level   = info
    log_handler = :INFO,werkzeug:WARNING,odoo.sql_db:WARNING
    syslog      = False
    logfile     =

    server_wide_modules = base,web,bus
    without_demo        = all
