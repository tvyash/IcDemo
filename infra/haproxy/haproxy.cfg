# HAProxy routing for the Patroni ic-demo-pg cluster.
#
#   port 5000 — writes, routed to whichever node Patroni's REST API reports
#               is currently the primary (http-check against /primary).
#   port 5001 — reads, load-balanced across the replicas (/replica).
#
# Patroni's REST API answers 200 only on the node whose role matches the
# path, and 503 everywhere else, so HAProxy's http-check cleanly discovers
# the current topology without needing to touch the DCS directly.
#
# Clients configured to use 5000 for writes and 5001 for reads:
#   Odoo:  db_host=haproxy.ic-demo.internal, db_port=5000,
#          db_replica_host=haproxy.ic-demo.internal, db_replica_port=5001
#   psql:  PGPORT=5001 psql ...   (replica queries)

global
    maxconn 1000

defaults
    log     global
    mode    tcp
    retries 2
    timeout client  30m
    timeout connect 4s
    timeout server  30m
    timeout check   5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen postgres_write
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1.ic-demo.internal:5432 maxconn 200 check port 8008
    server pg2 pg2.ic-demo.internal:5432 maxconn 200 check port 8008

listen postgres_read
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1.ic-demo.internal:5432 maxconn 200 check port 8008
    server pg2 pg2.ic-demo.internal:5432 maxconn 200 check port 8008
