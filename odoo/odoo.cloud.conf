[options]
; ---------------------------------------------------------------------------
; Odoo 20 — production (cloud/k3s) config for the ic_demo stack.
;
; Three deployments share this base file, each overriding just:
;   - odoo-web      : the HTTP preforked worker pool (sets `workers`)
;   - odoo-bus      : the gevent WS service (sets `workers = 0`, exposes 8072)
;   - odoo-cron     : the cron worker (sets `workers = 0`, `max_cron_threads`)
;
; Numbers assume a 4 vCPU / 8 GB Odoo pod. Tune ``workers`` to roughly
; (2 × vCPU + 1), memory limits to leave 1-1.5 GB headroom for the OS.
; ---------------------------------------------------------------------------

; Project root (/opt/odoo/ic_demo) holds ic_demo_dashboard/ and ic_demo_consolidation/ directly.
addons_path = /opt/odoo/enterprise,/opt/odoo/odoo/addons,/opt/odoo/ic_demo,/opt/odoo/ic_demo/addons/oca,/opt/odoo/ic_demo/addons/custom
data_dir   = /var/lib/odoo
; Behind an ingress — Odoo trusts X-Forwarded-* headers and builds absolute URLs from them.
proxy_mode = True

; --- Database routing -----------------------------------------------------
; Writes go to HAProxy's :5000 (currently-primary Patroni node).
; Reads use Odoo 20's native replica route to HAProxy :5001 (round-robin replicas).
db_host         = haproxy.ic-demo.internal
db_port         = 6432
db_user         = ic_demo
db_password     = ${IC_DEMO_PG_PASSWORD}
db_replica_host = haproxy.ic-demo.internal
db_replica_port = 6432
; With pgBouncer in transaction-pooling mode in front of HAProxy, each Odoo
; worker holds a short-lived client-side connection; 20 is plenty.
db_maxconn      = 20
dbfilter        = ^ic_demo$
list_db         = False
db_sslmode      = prefer

; --- HTTP + Bus ------------------------------------------------------------
xmlrpc_port    = 8069
gevent_port    = 8072
longpolling_port = 8072
; Keep the HTTP stack tight — larger bodies come through dedicated file endpoints.
limit_request  = 8192

; --- Worker pool (HTTP deployment) -----------------------------------------
; Rule of thumb: workers = 2 × vCPU + 1. The gevent/bus deployment runs
; workers = 0 (single process, gevent monkey-patched) and owns :8072.
workers           = 9
max_cron_threads  = 0

; --- Memory + time limits --------------------------------------------------
; A worker is recycled when it crosses limit_memory_hard. Soft is the hint;
; hard is the kill. These match the k8s pod ``resources.limits`` so a
; runaway worker doesn't take the pod with it.
limit_memory_soft       = 2147483648      ; 2 GB
limit_memory_hard       = 2684354560      ; 2.5 GB
limit_time_cpu          = 60
limit_time_real         = 120
limit_time_real_cron    = 1800
limit_request           = 8192

; --- Logging --------------------------------------------------------------
; Log to stdout so k8s picks it up.
logfile                 =
log_level               = info
log_handler             = :INFO,werkzeug:WARNING,odoo.sql_db:WARNING,odoo.addons.base.models.ir_cron:INFO
syslog                  = False

; --- Sessions + filestore -------------------------------------------------
; filestore and sessions both live under data_dir. In k8s this is a PVC
; mounted RWX from MinIO/Longhorn. For a single-pod cron deployment
; the same volume is mounted at /var/lib/odoo.
server_wide_modules     = base,web,bus
without_demo            = all

; --- Security niceties ----------------------------------------------------
; Rotate admin DB-management passphrase. Nobody connects to Odoo directly;
; ingress TLS terminates at nginx-ingress.
admin_passwd            = ${IC_DEMO_ADMIN_PASSPHRASE}
; Disable DB creation/drop over HTTP — infra does that.

; --- Observability --------------------------------------------------------
; odoo-prometheus-exporter sidecar scrapes Odoo's own metrics endpoint
; which this flag enables. The sidecar then publishes /metrics for k8s.
; (Keep false if you're not running the sidecar.)
; cf. https://github.com/camptocamp/odoo-prometheus-exporter
; monitoring_endpoint = True
